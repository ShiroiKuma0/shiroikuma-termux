## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2048M
android.useAndroidX=true

minSdkVersion=21
targetSdkVersion=28
ndkVersion=29.0.14206865
compileSdkVersion=36

markwonVersion=4.6.2

# --- shiroikuma-termux fork: per-build version tail (bumped by the buildFork task) ---------------
# Our N: versionName = "<upstream>+<base date>.<HH-MM>.g<sha8>+<NNN>", versionCode = <upstream code> * 10000 + N.
# It runs MONOTONICALLY and is reset to 1 ONLY when upstream's own versionCode (118) itself moves.
# Resetting it on a sync that merely moved the .g<sha> pin sends versionCode BACKWARDS, and
# versionCode is the only thing an installer compares — the date and sha in versionName are
# cosmetic. buildFork enforces this against LAST_BUILT_VERSION_CODE below.
BUILD_NUMBER=9

# Highest versionCode this repo has ever built; buildFork refuses to go at or below it.
LAST_BUILT_VERSION_CODE=1180008

# --- shiroikuma-termux fork: termux-shared publication --------------------------------------------
# `./gradlew publishReleasePublicationToMavenLocal` publishes OUR termux-shared (+ terminal-view,
# terminal-emulator, which its POM depends on)
# (white-bear names and links in TermuxConstants, the absorbed-plugin preference lookups) to
# ~/.m2 as com.termux:termux-shared:<this version>, which the sister forks (shiroikuma-termux-api)
# consume from mavenLocal() instead of upstream's JitPack build. Bump the -skN suffix whenever
# termux-shared changes in a way a sister fork must pick up; keep the upstream base in front.
SHIROIKUMA_TERMUX_SHARED_VERSION=0.118.0-sk1
